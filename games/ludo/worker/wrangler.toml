name = "fly-ludo-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_ORIGIN = "https://flyinfinitydao.github.io"
FRONTEND_ORIGINS = "https://flyinfinitydao.github.io"
BSC_RPC_URL = "https://bsc-dataseed.binance.org/"

[[d1_databases]]
binding = "DB"
database_name = "fly-ludo-db"
database_id = "10958107-153e-47cd-88a9-f3609f46ee2e"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom"]

[triggers]
crons = ["17 * * * *"]
