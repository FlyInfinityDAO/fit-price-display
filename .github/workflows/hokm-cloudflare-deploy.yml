name: Hokm Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [feature/hokm-four-player]
    paths:
      - 'games/hokm/worker/**'
      - '.github/workflows/hokm-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: hokm-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Hokm Worker
    if: github.ref == 'refs/heads/feature/hokm-four-player' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-hokm]'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/hokm/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HOKM_SESSION_SECRET: ${{ secrets.HOKM_SESSION_SECRET }}
    steps:
      - name: Checkout Hokm branch
        uses: actions/checkout@v4
        with:
          ref: feature/hokm-four-player

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add repository variable CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$HOKM_SESSION_SECRET" || { echo "::error::Add repository secret HOKM_SESSION_SECRET."; exit 1; }
          test "${#HOKM_SESSION_SECRET}" -ge 32 || { echo "::error::HOKM_SESSION_SECRET must contain at least 32 characters."; exit 1; }
          if grep -q 'REPLACE_WITH_HOKM_D1_DATABASE_ID' wrangler.toml; then
            echo "::error::Set the real fly-hokm-db database_id in games/hokm/worker/wrangler.toml before deployment."
            exit 1
          fi
          node --check src/index.js
          node --check src/security.js

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply fly-hokm-db --remote

      - name: Set Worker session secret
        shell: bash
        run: printf '%s' "$HOKM_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET

      - name: Deploy Worker
        run: npx wrangler deploy
