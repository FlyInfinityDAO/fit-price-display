name: Hokm Cloudflare Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'games/hokm/worker/wrangler.toml'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY_HOKM_WORKER to deploy Worker code only (no D1 migrations or secret changes)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hokm-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync Hokm Worker configuration from main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_deploy == 'DEPLOY_HOKM_WORKER')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/hokm/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Hokm production source from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add repository variable CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          if grep -q 'REPLACE_WITH_HOKM_D1_DATABASE_ID' wrangler.toml; then
            echo "::error::Set the existing fly-hokm-db database_id before deployment."
            exit 1
          fi
          node --check src/index.js
          node --check src/security.js
          node --check src/room.js

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker configuration and code (no D1 migrations)
        run: npx wrangler deploy

      - name: Verify Cloudflare Pages production origin is allowed by CORS
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS \
            --header "Origin: https://fly-hokm-preview.pages.dev" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            https://fly-hokm-api.flyinfinityplatform.workers.dev/api/auth/challenge)"
          printf '%s\\n' "$headers"
          printf '%s' "$headers" | tr -d '\\r' | grep -Fxi "access-control-allow-origin: https://fly-hokm-preview.pages.dev"
