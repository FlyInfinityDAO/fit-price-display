name: Fly Ludo Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "games/ludo/worker/**"
      - "games/ludo/js/ludo-engine.js"
      - ".github/workflows/ludo-cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY_LUDO_WORKER to deploy the standalone Ludo Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fly-ludo-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Fly Ludo Worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_deploy == 'DEPLOY_LUDO_WORKER')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/ludo/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout production source from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials and isolated resources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add repository variable CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          grep -q 'name = "fly-ludo-api"' wrangler.toml
          grep -q 'database_name = "fly-ludo-db"' wrangler.toml
          if grep -q 'REPLACE_WITH_FLY_LUDO_DB_ID' wrangler.toml; then
            echo "::error::Set the fly-ludo-db database UUID before deployment."
            exit 1
          fi
          node --check src/index.js
          node --check src/rooms-api.js
          node --check src/security.js
          node --check src/ludo-room.js

      - name: Install standalone Ludo Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Validate standalone Ludo Worker
        run: npm run check

      - name: Run Ludo engine and room tests
        run: npm test

      - name: Apply isolated Ludo D1 migrations
        run: printf 'y\n' | npx wrangler d1 migrations apply fly-ludo-db --remote

      - name: Deploy standalone Ludo Worker
        run: npx wrangler deploy

      - name: Verify production Worker, D1 binding and session secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = "https://fly-ludo-api.flyinfinityplatform.workers.dev/api/health";
          const response = await fetch(url, { cache: "no-store" });
          const data = await response.json();
          if (!response.ok || data.ok !== true || data.service !== "Fly Infinity Ludo API" ||
              data.version !== "1.0.2" || data.database !== "ok" || data.sessionConfigured !== true) {
            console.error("Ludo Worker health verification failed:", data);
            process.exit(1);
          }
          console.log("Ludo Worker healthy:", JSON.stringify(data));
          NODE
