name: Fly AI validation
on:
  pull_request:
    paths:
      - 'fly-ai/**'
      - 'backend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'fly-ai/**'
      - 'backend/**'
      - '.github/workflows/**'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript syntax
        run: |
          node --check fly-ai/js/app.js
          node --check fly-ai/js/i18n.js
          node --check fly-ai/js/config.js
          node --check walletconnect-bridge.js
      - name: Install Worker dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/ai-provider.js
