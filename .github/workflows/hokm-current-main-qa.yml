name: Hokm Current Main Isolated QA

on:
  push:
    branches:
      - qa/hokm-current-main-20261119
    paths:
      - 'games/hokm/**'
      - '.github/workflows/hokm-current-main-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hokm-current-main-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_BRANCH: hokm-current-main-20261119
      PREVIEW_URL: https://hokm-current-main-20261119.fly-hokm-preview.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/hokm-current-main-20261119

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and run Hokm Worker tests
        working-directory: games/hokm/worker
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Check Hokm frontend, engine and browser-test syntax
        run: |
          set -euo pipefail
          for file in \
            games/hokm/engine/hokm-engine.js \
            games/hokm/js/hokm.js \
            games/hokm/js/hokm-play.js \
            games/hokm/js/hokm-online.js \
            games/hokm/tests/hokm-browser-smoke.mjs; do
            node --check "$file"
          done

      - name: Run Hokm rules-engine tests
        run: node --test games/hokm/tests/hokm-engine.test.cjs

      - name: Install Playwright browser tests
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit

      - name: Prepare isolated Hokm preview
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hokm-preview/games"
          cp -R games/hokm "$RUNNER_TEMP/hokm-preview/games/hokm"
          cp games/fi-snakes-ui-theme.css games/shared-language-menu.js "$RUNNER_TEMP/hokm-preview/games/"
          cp logo.png walletconnect-bridge.js background-desktop.png background-mobile.png \
            pwa-shell.css pwa-brand-neon.css pwa-offline.js manifest.webmanifest pwa-icon.svg \
            pwa-icon-192.png pwa-icon-512.png "$RUNNER_TEMP/hokm-preview/"
          cat > "$RUNNER_TEMP/hokm-preview/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/games/hokm/"><title>Fly Infinity Hokm QA</title></head>
          <body><p>Opening <a href="/games/hokm/">Fly Infinity Hokm QA</a>…</p></body></html>
          HTML

      - name: Validate Cloudflare preview credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy isolated QA Pages branch
        working-directory: games/hokm/worker
        run: |
          set -euo pipefail
          if ! ./node_modules/.bin/wrangler pages project list | grep -q 'fly-hokm-preview'; then
            ./node_modules/.bin/wrangler pages project create fly-hokm-preview --production-branch main
          fi
          ./node_modules/.bin/wrangler pages deploy "$RUNNER_TEMP/hokm-preview" --project-name=fly-hokm-preview --branch="$PREVIEW_BRANCH"

      - name: Verify latest QA preview deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl --silent --show-error --fail "$PREVIEW_URL/games/hokm/" -o /tmp/hokm.html || true
            if grep -q 'Fly Infinity Hokm' /tmp/hokm.html 2>/dev/null && \
               grep -q 'hokm-trick-layout-best-of-20261119-v4' /tmp/hokm.html 2>/dev/null; then
              break
            fi
            echo "Waiting for the latest Pages HTML to propagate ($attempt/12)..."
            sleep 5
          done
          grep -q 'Fly Infinity Hokm' /tmp/hokm.html
          grep -q 'hokm-trick-layout-best-of-20261119-v4' /tmp/hokm.html
          curl --silent --show-error --fail "$PREVIEW_URL/games/hokm/css/hokm-classic-table.css?v=hokm-trick-layout-best-of-20261119-v4" -o /tmp/hokm-classic.css
          grep -q 'grid-template-columns:minmax(0,1fr)' /tmp/hokm-classic.css

      - name: Run solo gameplay browser smoke tests
        env:
          HOKM_PREVIEW_URL: ${{ env.PREVIEW_URL }}/games/hokm/
        run: node games/hokm/tests/hokm-browser-smoke.mjs
