name: Fly Infinity Games validation

on:
  pull_request:
    paths:
      - 'games/chess-arena/**'
      - 'games/backgammon/**'
      - 'games/hokm/**'\n      - 'games/ludo/**'
      - '.github/workflows/**'
  push:
    branches: [main, 'chore/**']
    paths:
      - 'games/chess-arena/**'
      - 'games/backgammon/**'
      - 'games/hokm/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-game-frontends:
    name: Validate all game frontend JavaScript and Backgammon rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every game frontend JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          files=(
            games/ludo/js/ludo-engine.js\n            games/ludo/js/ludo-engine.test.js\n            games/ludo/js/ludo.js\n            games/chess-arena/js/chess-arena.js
            games/chess-arena/js/language.js
            games/backgammon/js/backgammon-engine.js
            games/backgammon/js/backgammon-engine.test.js
            games/backgammon/js/backgammon.js
            games/hokm/engine/hokm-engine.js
            games/hokm/js/hokm.js
            games/hokm/js/hokm-play.js
            games/hokm/js/hokm-online.js
            games/hokm/js/hokm-wallet-bridge.js
            games/hokm/js/hokm-android-scroll.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
            node --input-type=module --check < "$file"
            echo "Syntax OK: $file"
          done
      - name: Run Fly Ludo rules-engine tests\n        run: node --experimental-default-type=module --test games/ludo/js/ludo-engine.test.js\n      - name: Run Backgammon rules-engine tests
        run: node --experimental-default-type=module --test games/backgammon/js/backgammon-engine.test.js
      - name: Build standalone Pages frontend and verify shared assets
        run: bash games/chess-arena/build-pages.sh

  validate-chess-backgammon-worker:
    name: Validate Chess Arena and Backgammon Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/chess-arena/worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax validation
        run: npm run check
      - name: Security tests
        run: npm run test:security

  validate-hokm-worker:
    name: Validate Hokm Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/hokm/worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax validation
        run: npm run check
