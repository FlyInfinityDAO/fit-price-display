name: Fly Infinity Social API — deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/social-api/src/**"
      - "backend/wrangler.social-api.toml"
      - "backend/package.json"
      - ".github/workflows/fly-social-api-provision.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-infinity-social-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SOCIAL_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SOCIAL_WORKER_URL: https://fly-infinity-social-api.flyinfinityplatform.workers.dev
      B2_ENDPOINT: ${{ secrets.FLY_SOCIAL_B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.FLY_SOCIAL_B2_BUCKET }}
      B2_KEY_ID: ${{ secrets.FLY_SOCIAL_B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.FLY_SOCIAL_B2_APPLICATION_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Validate Social API and run tests
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID B2_ENDPOINT B2_BUCKET B2_KEY_ID B2_APPLICATION_KEY; do
            test -n "${!name}" || { echo "::error::Missing required Social deploy secret or variable: $name"; exit 1; }
          done
          node --check social-api/src/index.js
          node --check social-api/src/auth.js
          node --check social-api/src/validation.js
          node --check social-api/src/storage.js
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('../creator-arena/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Social inline application script was not found');
          writeFileSync('/tmp/fly-social-page-inline.js', html.slice(start + 8, end));
          NODE
          node --check /tmp/fly-social-page-inline.js
          npm install --no-audit --no-fund
          node --test social-api/tests/*.test.js
          test "$(grep -c 'name = "fly-infinity-social-api"' wrangler.social-api.toml)" -eq 1
          test "$(grep -c 'database_name = "fly-infinity-social-db"' wrangler.social-api.toml)" -eq 1
          test "$(grep -c 'database_id = "64b672c3-cce6-418e-a0d2-da8d8ee3df7f"' wrangler.social-api.toml)" -eq 1
          test "$(grep -c 'REPLACE_WITH_FLY_INFINITY_SOCIAL_D1_ID' wrangler.social-api.toml || true)" -eq 0
          if grep -Eq 'r2_buckets|bucket_name' wrangler.social-api.toml; then
            echo "::error::Social Worker must not contain a Cloudflare R2 binding."
            exit 1
          fi

      - name: Apply pending Social D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply fly-infinity-social-db --remote --config=wrangler.social-api.toml

      - name: Verify private Backblaze B2 credentials and access
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import {
            S3Client, PutObjectCommand, GetObjectCommand, DeleteObjectCommand
          } from '@aws-sdk/client-s3';

          const endpointValue = process.env.B2_ENDPOINT.trim();
          const hasScheme = endpointValue.startsWith('https://') || endpointValue.startsWith('http://');
          const endpoint = new URL(hasScheme ? endpointValue : 'https://' + endpointValue);
          if (endpoint.protocol !== 'https:' || !/^s3\.[a-z0-9-]+\.backblazeb2\.com$/i.test(endpoint.hostname)) {
            throw new Error('Invalid Backblaze S3 endpoint');
          }
          const client = new S3Client({
            endpoint: endpoint.origin,
            region: endpoint.hostname.split('.')[1],
            forcePathStyle: true,
            credentials: {
              accessKeyId: process.env.B2_KEY_ID,
              secretAccessKey: process.env.B2_APPLICATION_KEY
            },
            requestChecksumCalculation: 'WHEN_REQUIRED',
            responseChecksumValidation: 'WHEN_REQUIRED'
          });
          const key = 'uploads/__fly_social_deploy_check_' + randomUUID() + '.txt';
          const marker = 'Fly Infinity Social B2 storage check';
          try {
            await client.send(new PutObjectCommand({
              Bucket: process.env.B2_BUCKET, Key: key, Body: marker,
              ContentType: 'text/plain'
            }));
            const object = await client.send(new GetObjectCommand({
              Bucket: process.env.B2_BUCKET, Key: key
            }));
            const value = await object.Body.transformToString();
            if (value !== marker) throw new Error('Backblaze read-back check failed');
            console.log('Private B2 bucket write/read verification passed.');
          } finally {
            await client.send(new DeleteObjectCommand({
              Bucket: process.env.B2_BUCKET, Key: key
            }));
          }
          NODE

      - name: Deploy only Fly Infinity Social API
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$B2_ENDPOINT" | npx wrangler secret put B2_ENDPOINT --config=wrangler.social-api.toml
          printf '%s' "$B2_BUCKET" | npx wrangler secret put B2_BUCKET --config=wrangler.social-api.toml
          printf '%s' "$B2_KEY_ID" | npx wrangler secret put B2_KEY_ID --config=wrangler.social-api.toml
          printf '%s' "$B2_APPLICATION_KEY" | npx wrangler secret put B2_APPLICATION_KEY --config=wrangler.social-api.toml
          npx wrangler deploy --config=wrangler.social-api.toml

      - name: Verify Social Worker health, CORS and input validation
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 12 --retry-delay 5 "$SOCIAL_WORKER_URL/api/health" | tee /tmp/social-health.json
          jq -e '.ok == true and .service == "Fly Infinity Social API"' /tmp/social-health.json >/dev/null
          preflight="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: https://flyinfinitydao.github.io" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type,authorization" \
            "$SOCIAL_WORKER_URL/api/auth/challenge")"
          test "$preflight" = "204"
          invalid="$(curl --silent --show-error --output /tmp/social-invalid.json --write-out '%{http_code}' \
            --header "Origin: https://flyinfinitydao.github.io" \
            --header "Content-Type: application/json" \
            --data '{"address":"not-a-wallet"}' "$SOCIAL_WORKER_URL/api/auth/challenge")"
          test "$invalid" = "400"
          jq -e '.error | test("wallet address")' /tmp/social-invalid.json >/dev/null
          echo "Social API health, strict CORS preflight and invalid-wallet rejection passed." >> "$GITHUB_STEP_SUMMARY"
