name: Fly Infinity Audio Studio sandbox
on:
  push:
    branches: [main]
    paths:
      - 'backend/audio-api/**'
      - 'backend/src/audio-quota.js'
      - 'backend/wrangler.audio-test.toml'
      - 'backend/tests/audio-quota.test.js'
      - 'fly-ai/audio-studio-test.html'
      - 'fly-ai/js/audio-studio.js'
      - 'fly-ai/js/audio-studio-test.js'
      - '.github/workflows/fly-audio-test-provision.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-infinity-audio-test
  cancel-in-progress: false
jobs:
  test-and-deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AUDIO_TEST_D1_NAME: fly-infinity-audio-test-db
      AUDIO_TEST_WORKER_URL: https://fly-infinity-audio-test.flyinfinityplatform.workers.dev
      AUDIO_TEST_ORIGIN: https://flyinfinitydao.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Validate worker and run tests
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check audio-api/src/index.js
          node --check audio-api/src/auth.js
          node --check src/audio-quota.js
          npm install --no-audit --no-fund
          npm test
      - name: Create or reuse dedicated EU audio test D1
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          listed="$(curl --silent --show-error --fail-with-body --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?name=$AUDIO_TEST_D1_NAME&per_page=100")"
          echo "$listed" | jq -e '.success == true' >/dev/null
          database_id="$(echo "$listed" | jq -r --arg name "$AUDIO_TEST_D1_NAME" '.result[]? | select(.name == $name) | .uuid' | head -n 1)"
          if [ -z "$database_id" ]; then
            created="$(curl --silent --show-error --fail-with-body --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$AUDIO_TEST_D1_NAME\",\"jurisdiction\":\"eu\"}" "$api")"
            echo "$created" | jq -e '.success == true' >/dev/null
            database_id="$(echo "$created" | jq -r '.result.uuid')"
          fi
          [[ "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          sed -i "s/REPLACE_WITH_FLY_INFINITY_AUDIO_TEST_D1_ID/$database_id/" wrangler.audio-test.toml
          echo "Audio test D1: $database_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply schemas only to audio test D1
        run: |
          set -euo pipefail
          test "$(grep -c 'database_name = "fly-infinity-audio-test-db"' wrangler.audio-test.toml)" -eq 1
          test "$(grep -c 'database_name = "fly-infinity-audio-db"' wrangler.audio-test.toml || true)" -eq 0
          test "$(grep -c 'database_name = "fly-ai-db"' wrangler.audio-test.toml || true)" -eq 0
          npx wrangler d1 execute "$AUDIO_TEST_D1_NAME" --remote --file=audio-api/migrations/0001_init.sql --config=wrangler.audio-test.toml
          npx wrangler d1 execute "$AUDIO_TEST_D1_NAME" --remote --file=audio-api/migrations/0002_preview.sql --config=wrangler.audio-test.toml
      - name: Deploy isolated no-wallet audio test Worker
        run: npx wrangler deploy --config=wrangler.audio-test.toml
      - name: Verify health and confirm cloud speech preview is disabled
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 12 --retry-delay 5 "$AUDIO_TEST_WORKER_URL/api/health"
          preview_status="$(curl --silent --show-error --output /tmp/audio-preview.json --write-out '%{http_code}' \
            --header "Origin: $AUDIO_TEST_ORIGIN" \
            --header "Content-Type: application/json" \
            --data '{"text":"Cloud speech must remain disabled."}' \
            "$AUDIO_TEST_WORKER_URL/api/audio/preview")"
          test "$preview_status" = "410"
          jq -e '.error | test("fully free")' /tmp/audio-preview.json >/dev/null
          echo "Cloud speech preview is disabled; no model credits can be consumed." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify GitHub Pages CORS and Gemini proxy request validation
        run: |
          set -euo pipefail
          preflight_status="$(curl --silent --show-error --dump-header /tmp/audio-cors-headers.txt --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: $AUDIO_TEST_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "$AUDIO_TEST_WORKER_URL/api/audio/gemini-tts")"
          test "$preflight_status" = "204"
          grep -qi "Access-Control-Allow-Origin: $AUDIO_TEST_ORIGIN" /tmp/audio-cors-headers.txt
          proxy_status="$(curl --silent --show-error --output /tmp/audio-proxy-validation.json --write-out '%{http_code}' \
            --header "Origin: $AUDIO_TEST_ORIGIN" \
            --header "Content-Type: application/json" \
            --data '{"text":"سلام","locale":"fa-IR","voiceName":"Sulafat"}' \
            "$AUDIO_TEST_WORKER_URL/api/audio/gemini-tts")"
          test "$proxy_status" = "400"
          jq -e '.error | test("API Studio API key")' /tmp/audio-proxy-validation.json >/dev/null
          echo "GitHub Pages CORS preflight passed and proxy validates requests without logging or storing credentials." >> "$GITHUB_STEP_SUMMARY"
