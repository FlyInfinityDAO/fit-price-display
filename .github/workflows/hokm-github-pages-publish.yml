name: Publish Fly Infinity Games on GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'logo.png'
      - 'walletconnect-bridge.js'
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - 'assets/**'
      - 'images/**'
      - 'games/**'
      - 'fly-ai/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate and publish the existing development site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main site and integrated games
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Validate site and game entry points
        shell: bash
        run: |
          set -euo pipefail

          test -f site/index.html || { echo "::error::The site index.html is missing."; exit 1; }
          test -f site/logo.png || { echo "::error::The site logo.png is missing."; exit 1; }
          test -f site/walletconnect-bridge.js || { echo "::error::The wallet bridge is missing."; exit 1; }

          for game in chess-arena backgammon hokm ludo; do
            test -f "site/games/$game/index.html" || {
              echo "::error::Missing games/$game/index.html"
              exit 1
            }
          done

          test -f site/games/index.html || {
            echo "::error::Games hub is missing."
            exit 1
          }

          test -f site/games/ludo/css/ludo.css || {
            echo "::error::Ludo stylesheet is missing."
            exit 1
          }
          test -f site/games/ludo/js/ludo.js || {
            echo "::error::Ludo frontend is missing."
            exit 1
          }
          test -f site/games/ludo/js/ludo-engine.js || {
            echo "::error::Ludo rules engine is missing."
            exit 1
          }

          test -f site/games/chess-arena/css/chess-arena.css || {
            echo "::error::Chess Arena stylesheet is missing."
            exit 1
          }
          test -f site/games/backgammon/css/backgammon.css || {
            echo "::error::Backgammon stylesheet is missing."
            exit 1
          }
          test -f site/games/hokm/css/hokm.css || {
            echo "::error::Hokm stylesheet is missing."
            exit 1
          }

          echo "Validated all three integrated game entry points and required assets."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
