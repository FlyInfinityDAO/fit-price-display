name: Publish Hokm on GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hokm-github-pages-publish.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Publish existing site plus isolated Hokm page
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout the currently published site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout the isolated Hokm implementation
        uses: actions/checkout@v4
        with:
          ref: feature/hokm-four-player
          path: hokm-source

      - name: Validate inputs and assemble the Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f site/index.html || { echo "::error::The current site index.html is missing."; exit 1; }
          test -f site/logo.png || { echo "::error::The current site logo.png is missing."; exit 1; }
          test -f site/walletconnect-bridge.js || { echo "::error::The current wallet bridge is missing."; exit 1; }
          test -f hokm-source/games/hokm/index.html || { echo "::error::Hokm page was not found on feature/hokm-four-player."; exit 1; }
          test -f hokm-source/games/hokm/engine/hokm-engine.js || { echo "::error::Hokm engine is missing."; exit 1; }
          test -f hokm-source/games/hokm/js/hokm.js || { echo "::error::Hokm frontend script is missing."; exit 1; }
          test -f hokm-source/games/hokm/js/hokm-wallet-bridge.js || { echo "::error::Hokm wallet bridge is missing."; exit 1; }

          if [ -e site/games/hokm ]; then
            echo "::error::games/hokm already exists on main. Stop to avoid overwriting existing content."
            exit 1
          fi

          mkdir -p site/games
          cp -R hokm-source/games/hokm site/games/hokm

          node --check site/games/hokm/engine/hokm-engine.js
          node --check site/games/hokm/js/hokm.js
          node --check site/games/hokm/js/hokm-wallet-bridge.js

          test -f site/games/hokm/css/hokm.css
          test -f site/games/hokm/worker/src/index.js
          echo "Prepared the existing main site with only the isolated games/hokm directory added."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
