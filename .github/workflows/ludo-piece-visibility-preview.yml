name: Ludo Piece Visibility Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/ludo/css/ludo.css'
      - 'games/ludo/index.html'
      - 'games/ludo/tests/ludo-piece-visibility-smoke.mjs'
      - 'games/chess-arena/build-pages.sh'
      - 'games/fi-snakes-ui-theme.css'
      - '.github/workflows/ludo-piece-visibility-preview.yml'

permissions:
  contents: read

concurrency:
  group: ludo-piece-visibility-preview
  cancel-in-progress: true

jobs:
  preview-and-verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LUDO_PREVIEW_URL: https://ludo-piece-visibility.fly-hokm-preview.pages.dev
    steps:
      - name: Checkout proposed Ludo change
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.64.1

      - name: Install Wrangler
        working-directory: games/hokm/worker
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }

      - name: Build the existing integrated Games site
        shell: bash
        run: |
          set -euo pipefail
          bash games/chess-arena/build-pages.sh
          test -s dist/games/ludo/index.html
          test -s dist/games/ludo/css/ludo.css
          grep -Fq 'fly-ludo-23' dist/games/ludo/index.html

      - name: Deploy to isolated Cloudflare Pages preview branch
        working-directory: games/hokm/worker
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler pages project list | grep -F 'fly-hokm-preview'
          ./node_modules/.bin/wrangler pages deploy ../../../dist \
            --project-name=fly-hokm-preview \
            --branch=ludo-piece-visibility

      - name: Verify preview HTML and CSS assets
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 12 --retry-delay 5 \
            "$LUDO_PREVIEW_URL/games/ludo/" -o /tmp/ludo-preview.html
          grep -Fq 'fly-ludo-23' /tmp/ludo-preview.html
          curl --silent --show-error --fail \
            "$LUDO_PREVIEW_URL/games/ludo/css/ludo.css?v=fly-ludo-23" -o /tmp/ludo-preview.css
          grep -Fq 'Keep Ludo pieces vivid when disabled' /tmp/ludo-preview.css

      - name: Verify vivid pieces in desktop Chromium and mobile WebKit
        run: node games/ludo/tests/ludo-piece-visibility-smoke.mjs
