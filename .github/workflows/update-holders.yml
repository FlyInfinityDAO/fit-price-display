name: Update FIT Holder Count

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update-holders.js"
      - ".github/workflows/update-holders.yml"

permissions:
  contents: write

concurrency:
  group: fit-holder-count
  cancel-in-progress: false

jobs:
  update-holders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch current FIT holder count
        run: node update-holders.js

      - name: Commit holder data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holders-data.json
          if git diff --cached --quiet; then
            echo "Holder data is unchanged"
          else
            git commit -m "🤖 Update FIT holder count [skip ci]"
            git push
          fi
