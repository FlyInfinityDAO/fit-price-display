name: Backgammon Browser and Worker API Tests

on:
  push:
    branches: [feature/chess-arena-games]
    paths:
      - 'games/backgammon/**'
      - '.github/workflows/backgammon-browser-tests.yml'
  pull_request:
    paths:
      - 'games/backgammon/**'
      - '.github/workflows/backgammon-browser-tests.yml'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/backgammon-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/games/backgammon/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/backgammon-http.log
          exit 1
      - name: Run browser smoke tests
        run: node games/backgammon/tests/browser-smoke.mjs

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live Cloudflare Pages deployment
        env:
          BACKGAMMON_TEST_URL: https://fly-chess-arena.pages.dev/games/backgammon/
        run: node games/backgammon/tests/browser-smoke.mjs

  worker-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live Worker health and backgammon stats route guards
        env:
          BACKGAMMON_WORKER_URL: https://fly-chess-arena-api.flyinfinityplatform.workers.dev
        run: node games/backgammon/tests/worker-api-smoke.mjs
