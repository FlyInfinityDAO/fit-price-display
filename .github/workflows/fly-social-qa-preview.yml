name: Fly Infinity Social QA — isolated preview

on:
  push:
    branches:
      - "qa/social-full-audit-2026-11-23"
    paths:
      - "creator-arena/**"
      - "creator-arena-qa/**"
      - "backend/social-api/**"
      - "backend/wrangler.social-qa.toml"
      - "backend/package.json"
      - "global-bottom-nav.js"
      - "global-bottom-nav.css"
      - "walletconnect-bridge.js"
      - "ambient-motion.css"
      - "pwa-brand-neon.css"
      - "background-desktop.png"
      - "background-mobile.png"
      - "logo.png"
      - "qa-tests/**"
      - ".github/workflows/fly-social-qa-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-social-qa-preview
  cancel-in-progress: true

jobs:
  deploy-isolated-social-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SOCIAL_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      B2_ENDPOINT: ${{ secrets.FLY_SOCIAL_B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.FLY_SOCIAL_B2_BUCKET }}
      B2_KEY_ID: ${{ secrets.FLY_SOCIAL_B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.FLY_SOCIAL_B2_APPLICATION_KEY }}
      QA_PAGES_PROJECT: fly-social-qa-preview
      QA_PAGES_BRANCH: qa-preview
      QA_WORKER_URL: https://fly-social-qa.flyinfinityplatform.workers.dev

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID B2_ENDPOINT B2_BUCKET B2_KEY_ID B2_APPLICATION_KEY; do
            test -n "${!name}" || { echo "::error::Missing required QA deploy secret or variable: $name"; exit 1; }
          done
          test -f creator-arena-qa/index.html
          test -f creator-arena-qa/social-brand-theme.css
          test -f creator-arena-qa/social-api.css
          test -f creator-arena-qa/social-api.js
          test -f backend/wrangler.social-qa.toml
          if grep -q '64b672c3-cce6-418e-a0d2-da8d8ee3df7f' backend/wrangler.social-qa.toml; then
            echo "::error::QA Worker config points at the production Social D1 database."
            exit 1
          fi

      - name: Validate page DOM references and inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const file of ['creator-arena/index.html', 'creator-arena-qa/index.html']) {
            const html = readFileSync(file, 'utf8');
            const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
            const idSet = new Set(ids);
            if (idSet.size !== ids.length) throw new Error(file + ': duplicate HTML ids detected');
            const missing = [...new Set([...html.matchAll(/\$\(["']([^"']+)["']\)/g)]
              .map(match => match[1]).filter(id => !idSet.has(id)))];
            if (missing.length) throw new Error(file + ': missing DOM ids: ' + missing.join(', '));
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
              .map(match => match[1]).filter(source => source.trim());
            if (!scripts.length) throw new Error(file + ': no inline app scripts found');
            scripts.forEach((source, index) => {
              const target = '/tmp/social-qa-' + file.replaceAll('/', '-') + '-' + index + '.js';
              writeFileSync(target, source);
            });
          }
          NODE
          for file in /tmp/social-qa-*.js; do node --check "$file"; done

      - name: Run Social Worker tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check social-api/src/index.js
          node --check social-api/src/auth.js
          node --check social-api/src/validation.js
          node --check social-api/src/storage.js
          node --test social-api/tests/*.test.js
          python3 social-api/tests/schema-smoke.py

      - name: Ensure EU-only QA D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          DB_LIST="$(npx --yes wrangler@4.158.0 d1 list --json)"
          DB_ID="$(printf '%s' "$DB_LIST" | node -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const parsed = JSON.parse(raw);
            const rows = Array.isArray(parsed) ? parsed : (parsed.result || parsed.databases || []);
            const row = rows.find(item => item.name === "fly-social-qa-db");
            process.stdout.write(row?.uuid || row?.database_id || "");
          ')"
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@4.158.0 d1 create fly-social-qa-db --jurisdiction=eu
            DB_LIST="$(npx --yes wrangler@4.158.0 d1 list --json)"
            DB_ID="$(printf '%s' "$DB_LIST" | node -e '
              let raw = "";
              for await (const chunk of process.stdin) raw += chunk;
              const parsed = JSON.parse(raw);
              const rows = Array.isArray(parsed) ? parsed : (parsed.result || parsed.databases || []);
              const row = rows.find(item => item.name === "fly-social-qa-db");
              process.stdout.write(row?.uuid || row?.database_id || "");
            ')"
          fi
          test -n "$DB_ID" || { echo "::error::Could not resolve Social QA D1 database ID"; exit 1; }
          sed -i "s/REPLACE_WITH_SOCIAL_QA_D1_ID/$DB_ID/" backend/wrangler.social-qa.toml
          echo "SOCIAL_QA_D1_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Dedicated EU Social QA D1 database is ready."

      - name: Apply Social schema to QA-only D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.158.0 d1 migrations apply fly-social-qa-db --remote --config=backend/wrangler.social-qa.toml

      - name: Create isolated Cloudflare Pages project when needed
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS="$(npx --yes wrangler@4.158.0 pages project list)"
          if ! printf '%s' "$PROJECTS" | grep -Fq "$QA_PAGES_PROJECT"; then
            npx --yes wrangler@4.158.0 pages project create "$QA_PAGES_PROJECT" --production-branch=main
          fi

      - name: Stage only Social QA page and shared visual assets
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/fly-social-qa-site"
          mkdir -p "$STAGE/creator-arena-qa"
          cp -a creator-arena-qa/. "$STAGE/creator-arena-qa/"
          cp creator-arena/index.html "$STAGE/creator-arena-qa/index.html"
          cp creator-arena/social-brand-theme.css "$STAGE/creator-arena-qa/social-brand-theme.css"
          cp creator-arena/social-api.css "$STAGE/creator-arena-qa/social-api.css"
          cp creator-arena/social-api.js "$STAGE/creator-arena-qa/social-api.js"
          python3 - <<'PY'
          from pathlib import Path
          html = Path("creator-arena-qa/index.html").read_text(encoding="utf-8")
          def replace_once(old, new, label):
              global html
              if html.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, got {html.count(old)}")
              html = html.replace(old, new, 1)
          replace_once('<meta name="theme-color" content="#0F0F0F">', '<meta name="theme-color" content="#0F0F0F">' + chr(10) + '<meta name="robots" content="noindex,nofollow">', "robots")
          replace_once('<meta name="description" content="Fly Infinity Social — share images and text with the Fly Infinity community.">', '<meta name="description" content="Isolated Fly Infinity Social QA preview. Test accounts and content are separate from production.">', "description")
          replace_once("<title>Fly Infinity Social | Fly Infinity</title>", "<title>Fly Infinity Social QA | Fly Infinity</title>", "title")
          marker = "  </header>" + chr(10) + chr(10) + "  <main>"
          banner = '  </header>' + chr(10) + '  <div class="qa-banner" role="status">QA PREVIEW · SEPARATE DATABASE · TEST DATA ONLY</div>' + chr(10) + chr(10) + '  <main>'
          replace_once(marker, banner, "QA banner")
          config = """<script>
          window.FLY_INFINITY_SOCIAL_API="https://fly-social-qa.flyinfinityplatform.workers.dev";
          window.FLY_GLOBAL_NAV_ROOT="https://flyinfinitydao.github.io/fit-price-display/";
          window.FLY_SOCIAL_PATH=window.location.origin+"/creator-arena-qa/index.html";
          </script>
          """
          script_marker = "<script>" + chr(10) + "(function(){"
          replace_once(script_marker, config + script_marker, "QA API and navigation config")
          Path("creator-arena-qa/index.html").write_text(html, encoding="utf-8")
          PY
          for asset in logo.png background-desktop.png background-mobile.png ambient-motion.css pwa-brand-neon.css global-bottom-nav.js global-bottom-nav.css walletconnect-bridge.js; do
            test -f "$asset" || { echo "::error::Missing shared Social asset: $asset"; exit 1; }
            cp "$asset" "$STAGE/$asset"
          done
          echo "SOCIAL_QA_STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Deploy isolated Social QA website
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT="$(npx --yes wrangler@4.158.0 pages deploy "$SOCIAL_QA_STAGE" \
            --project-name="$QA_PAGES_PROJECT" \
            --branch="$QA_PAGES_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Fly Infinity Social QA preview" 2>&1)"
          printf '%s\n' "$DEPLOY_OUTPUT"
          QA_ORIGIN="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[[:alnum:]-]+[.]fly-social-qa-preview[.]pages[.]dev' | head -n 1)"
          test -n "$QA_ORIGIN" || { echo "::error::Could not resolve the immutable Cloudflare Pages preview URL"; exit 1; }
          sed -i "s|^APP_ORIGIN = .*|APP_ORIGIN = \"$QA_ORIGIN\"|" backend/wrangler.social-qa.toml
          echo "QA_ORIGIN=$QA_ORIGIN" >> "$GITHUB_ENV"
          echo "CORS origin pinned to this exact immutable Pages deployment: $QA_ORIGIN"

      - name: Configure QA-only private image storage credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$B2_ENDPOINT" | npx --yes wrangler@4.158.0 secret put B2_ENDPOINT --config=backend/wrangler.social-qa.toml
          printf '%s' "$B2_BUCKET" | npx --yes wrangler@4.158.0 secret put B2_BUCKET --config=backend/wrangler.social-qa.toml
          printf '%s' "$B2_KEY_ID" | npx --yes wrangler@4.158.0 secret put B2_KEY_ID --config=backend/wrangler.social-qa.toml
          printf '%s' "$B2_APPLICATION_KEY" | npx --yes wrangler@4.158.0 secret put B2_APPLICATION_KEY --config=backend/wrangler.social-qa.toml

      - name: Deploy isolated Social QA Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.158.0 deploy --config=backend/wrangler.social-qa.toml

      - name: Verify QA Worker health and origin isolation
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 10 --retry-delay 5 "$QA_WORKER_URL/api/health" | tee /tmp/social-qa-health.json
          jq -e '.ok == true and .service == "Fly Infinity Social API"' /tmp/social-qa-health.json >/dev/null
          preflight="000"
          for attempt in $(seq 1 12); do
            preflight="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS --header "Origin: $QA_ORIGIN" \
              --header "Access-Control-Request-Method: POST" \
              --header "Access-Control-Request-Headers: content-type,authorization" \
              "$QA_WORKER_URL/api/auth/challenge")"
            echo "QA preflight attempt $attempt returned HTTP $preflight"
            [ "$preflight" = "204" ] && break
            sleep 3
          done
          preflight_headers="$(curl --silent --show-error --include \
            --request OPTIONS --header "Origin: $QA_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type,authorization" \
            "$QA_WORKER_URL/api/auth/challenge")"
          printf '%s\n' "$preflight_headers"
          test "$preflight" = "204"
          rejected="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Origin: https://flyinfinitydao.github.io" \
            --header "Content-Type: application/json" --data '{}' \
            "$QA_WORKER_URL/api/auth/challenge")"
          echo "Production-origin rejection HTTP status: $rejected"
          test "$rejected" = "403"
          echo "QA preview: $QA_ORIGIN/creator-arena-qa/" >> "$GITHUB_STEP_SUMMARY"
          echo "QA API: $QA_WORKER_URL/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "The QA API rejects requests from the production GitHub Pages origin." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright Chromium for responsive QA
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_DIR="$RUNNER_TEMP/social-ui-playwright"
          mkdir -p "$PLAYWRIGHT_DIR"
          npm install --prefix "$PLAYWRIGHT_DIR" --no-audit --no-fund --no-save playwright@1.56.1
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$PLAYWRIGHT_DIR/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Test Social responsive layouts at mobile and desktop widths
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QA_ORIGIN"
          test -f qa-tests/social-responsive-playwright.mjs
          node qa-tests/social-responsive-playwright.mjs

      - name: Upload Social QA responsive screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-infinity-social-responsive-qa
          path: qa-ui-artifacts/
          if-no-files-found: warn
          retention-days: 7
