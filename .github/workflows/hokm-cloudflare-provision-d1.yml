name: Hokm Cloudflare D1 Provision (Emergency Only)

on:
  workflow_dispatch:
    inputs:
      confirm_create:
        description: "Type CREATE_HOKM_D1 only when intentionally provisioning a brand-new database"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hokm-cloudflare-provision-d1
  cancel-in-progress: false

jobs:
  provision:
    name: Create Hokm D1 only when no database exists
    if: github.ref == 'refs/heads/main' && inputs.confirm_create == 'CREATE_HOKM_D1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/hokm/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout current development source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials and require an unprovisioned placeholder
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          grep -q 'REPLACE_WITH_HOKM_D1_DATABASE_ID' wrangler.toml || {
            echo "::error::A real database_id is already configured. Refusing to create a duplicate fly-hokm-db. Use the existing database."
            exit 1
          }

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Create D1 database only after the safeguards pass
        id: create_db
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 create fly-hokm-db 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          database_id="$(printf '%s\n' "$output" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)"
          if [ -z "$database_id" ]; then
            echo "::error::Could not automatically extract the D1 database ID. Review the Wrangler output in this run."
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "::notice::A new D1 was created. Record its ID and update wrangler.toml in a reviewed pull request before deploying."

      - name: Publish database ID as workflow summary
        env:
          DATABASE_ID: ${{ steps.create_db.outputs.database_id }}
        run: |
          {
            echo "## Hokm D1 database created"
            echo
            echo "Database name: `fly-hokm-db`"
            echo
            echo "Database ID: `$DATABASE_ID`"
            echo
            echo "No Worker deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
