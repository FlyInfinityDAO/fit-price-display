name: Backgammon Engine Tests

on:
  push:
    branches: [feature/chess-arena-games]
    paths:
      - 'games/backgammon/**'
      - '.github/workflows/backgammon-engine-tests.yml'
  pull_request:
    paths:
      - 'games/backgammon/**'
      - '.github/workflows/backgammon-engine-tests.yml'

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic rules tests
        run: node --experimental-default-type=module --test games/backgammon/tests/engine.test.mjs
