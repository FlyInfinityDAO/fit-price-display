name: Fly Infinity Social API — tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/social-api/**'
      - 'creator-arena/social-api.js'
      - 'creator-arena/index.html'
      - 'backend/package.json'
      - 'backend/wrangler.social-api.toml'
      - 'owner-profile.html'
      - 'owner-profile.css'
      - 'owner-profile.js'
      - 'lang/owner-profile/**'
      - 'site-navigation.js'
      - 'lang.js'
      - 'dapp.html'
      - '.github/workflows/fly-social-api-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/social-api/**'
      - 'creator-arena/social-api.js'
      - 'creator-arena/index.html'
      - 'backend/package.json'
      - '.github/workflows/fly-social-api-check.yml'

permissions:
  contents: read

jobs:
  social-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check Social Worker JavaScript syntax
        run: |
          node --check social-api/src/index.js
          node --check social-api/src/auth.js
          node --check social-api/src/owner-profile.js
          node --check social-api/src/validation.js
          node --check social-api/src/storage.js
          node --check ../creator-arena/social-api.js
      - name: Check Owner Profile frontend and language dictionaries
        run: |
          node --check ../owner-profile.js
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const html = readFileSync('../owner-profile.html', 'utf8');
          const js = readFileSync('../owner-profile.js', 'utf8');
          const ids = new Set([...html.matchAll(/\\bid="([^"]+)"/g)].map(match => match[1]));
          const missing = [...js.matchAll(/\\$\\('([^']+)'\\)/g)].map(match => match[1]).filter(id => !ids.has(id));
          if (missing.length) throw new Error('Owner Profile references missing element IDs: ' + [...new Set(missing)].join(', '));
          for (const file of readdirSync('../lang/owner-profile').filter(name => name.endsWith('.json'))) {
            JSON.parse(readFileSync('../lang/owner-profile/' + file, 'utf8'));
          }
          if (!/owner-profile.html/.test(readFileSync('../site-navigation.js', 'utf8'))) throw new Error('Owner Profile navigation link is missing');
          console.log('Owner Profile frontend syntax, DOM IDs, navigation and language JSON validated.');
          NODE
      - name: Check Social page inline JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('../creator-arena/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Social inline application script was not found');
          writeFileSync('/tmp/fly-social-page-inline.js', html.slice(start + 8, end));
          NODE
          node --check /tmp/fly-social-page-inline.js
      - name: Run Social-only unit and route tests
        run: node --test social-api/tests/*.test.js
      - name: Build Social Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/social-api-dry-run --config=wrangler.social-api.toml
      - name: Validate Social D1 schema and constraints
        run: python3 social-api/tests/schema-smoke.py
