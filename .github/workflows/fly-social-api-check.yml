name: Fly Infinity Social API — tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/social-api/**'
      - 'creator-arena/social-api.js'
      - 'creator-arena/index.html'
      - 'backend/package.json'
      - 'backend/wrangler.social-api.toml'
      - 'owner-profile.html'
      - 'owner-profile.css'
      - 'owner-profile.js'
      - 'owner-profile-test.html'
      - 'owner-profile-test.js'
      - 'lang/owner-profile/**'
      - 'site-navigation.js'
      - 'lang.js'
      - 'dapp.html'
      - '.github/workflows/fly-social-api-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/social-api/**'
      - 'creator-arena/social-api.js'
      - 'creator-arena/index.html'
      - 'backend/package.json'
      - 'owner-profile.html'
      - 'owner-profile.css'
      - 'owner-profile.js'
      - 'owner-profile-test.html'
      - 'owner-profile-test.js'
      - 'lang/owner-profile/**'
      - 'site-navigation.js'
      - 'lang.js'
      - 'dapp.html'
      - '.github/workflows/fly-social-api-check.yml'

permissions:
  contents: read

jobs:
  social-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check Social Worker JavaScript syntax
        run: |
          node --check social-api/src/index.js
          node --check social-api/src/auth.js
          node --check social-api/src/owner-profile.js
          node --check social-api/src/validation.js
          node --check social-api/src/storage.js
          node --check ../creator-arena/social-api.js
      - name: Check Owner Profile frontend and language dictionaries
        run: |
          node --check ../owner-profile.js
          node --check ../owner-profile-test.js
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const html = readFileSync('../owner-profile.html', 'utf8');
          const js = readFileSync('../owner-profile.js', 'utf8');
          const testHtml = readFileSync('../owner-profile-test.html', 'utf8');
          const testJs = readFileSync('../owner-profile-test.js', 'utf8');
          const ids = new Set([...html.matchAll(/id="([^"]+)"/g)].map(match => match[1]));
          const missing = [...js.matchAll(/\$\('([^']+)'\)/g)].map(match => match[1]).filter(id => !ids.has(id));
          if (missing.length) throw new Error('Owner Profile references missing element IDs: ' + [...new Set(missing)].join(', '));
          for (const file of readdirSync('../lang/owner-profile').filter(name => name.endsWith('.json'))) {
            JSON.parse(readFileSync('../lang/owner-profile/' + file, 'utf8'));
          }
          if (!/owner-profile.html/.test(readFileSync('../site-navigation.js', 'utf8'))) throw new Error('Owner Profile navigation link is missing');
          if (!/0xc8199B9A3408631a0defBfb7381b736f582Ce642/i.test(testHtml)) throw new Error('Fixed test wallet is missing from the test page');
          if (!testHtml.includes('<meta name="viewport"')) throw new Error('Read-only test page viewport meta is missing');
          const ownerCss = readFileSync('../owner-profile.css', 'utf8');
          const ownerBackend = readFileSync('social-api/src/owner-profile.js', 'utf8');
          if (!ownerCss.includes('overflow-x:auto')) throw new Error('Genealogy viewport must support independent horizontal scrolling');
          if (!ownerCss.includes('.owner-profile-page .lang-btn') || !ownerCss.includes('.owner-profile-page .lang-dropdown')) throw new Error('Shared language selector styles are missing from Owner Profile');
          if (!html.includes('id="opTabLogin" type="button" role="tab" aria-selected="true"') || !html.includes('<div class="op-form op-hidden" id="opRegisterForm">')) throw new Error('Owner Profile must default to sign-in');
          if (html.includes('opAddWallet') || html.includes('Add another wallet') || html.includes('Add wallet via browser')) throw new Error('Owner Profile must not expose secondary wallet controls');
          if (js.includes('/api/owner-profile/wallets') || js.includes('function addWallet(') || js.includes('function removeWallet(')) throw new Error('Owner Profile frontend must not add or remove linked wallets');
          if (!js.includes('Math.max(0, balance * (currentPrice - price))')) throw new Error('FIT estimated growth must not display losses');
          if (!ownerBackend.includes('profile_id=? AND is_primary=1 LIMIT 1') || !ownerBackend.includes('Additional wallet linking is disabled')) throw new Error('Social API must enforce a single primary wallet per Owner Profile');
          if (!ownerBackend.includes('wallet_address=? AND is_primary=1')) throw new Error('Password recovery must verify the profile primary wallet only');
          for (const file of readdirSync('../lang/owner-profile').filter(name => name.endsWith('.json'))) {
            const dictionary = JSON.parse(readFileSync('../lang/owner-profile/' + file, 'utf8')).ownerProfile;
            for (const key of ['walletOnlyNote','registeredWallets','verifiedOnly','profitTitle','profitNote','networkNote']) {
              if (!dictionary[key]) throw new Error(file + ' is missing Owner Profile translation: ' + key);
            }
          }
          if (testJs.includes('/api/owner-profile/auth/challenge') || testJs.includes('/api/owner-profile/register') || testJs.includes('/api/owner-profile/login')) throw new Error('Read-only test page must not call account authentication endpoints');
          console.log('Owner Profile single-wallet flow, sign-in default, shared language UI, FIT growth labels, read-only test bench and genealogy viewport validated.');
          NODE
      - name: Check Social page inline JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('../creator-arena/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Social inline application script was not found');
          writeFileSync('/tmp/fly-social-page-inline.js', html.slice(start + 8, end));
          NODE
          node --check /tmp/fly-social-page-inline.js
      - name: Run Social-only unit and route tests
        run: node --test social-api/tests/*.test.js
      - name: Build Social Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/social-api-dry-run --config=wrangler.social-api.toml
      - name: Validate Social D1 schema and constraints
        run: python3 social-api/tests/schema-smoke.py
