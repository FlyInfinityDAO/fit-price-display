name: Fly Snakes & Ladders Cloudflare Deploy
on:
  push:
    branches: [main]
    paths:
      - "games/snakes-and-ladders/worker/**"
      - ".github/workflows/snakes-and-ladders-cloudflare-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-snakes-and-ladders-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/snakes-and-ladders/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SNAKES_SESSION_SECRET: ${{ secrets.SNAKES_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }
          test -n "$SNAKES_SESSION_SECRET" && test "${#SNAKES_SESSION_SECRET}" -ge 32 || {
            echo "::error::Add SNAKES_SESSION_SECRET as a GitHub Actions secret (at least 32 characters)."
            exit 1
          }
      - name: Provision isolated D1 database
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          LIST="$(curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100")"
          DB_ID="$(printf '%s' "$LIST" | jq -r '.result[]? | select(.name == "fly-snakes-and-ladders-db") | .uuid' | head -n 1)"
          if [ -z "$DB_ID" ]; then
            CREATED="$(curl --fail-with-body -sS -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"fly-snakes-and-ladders-db"}')"
            DB_ID="$(printf '%s' "$CREATED" | jq -r '.result.uuid // empty')"
          fi
          test -n "$DB_ID" || { echo "::error::Could not provision the dedicated D1 database. Confirm D1:Edit permission."; exit 1; }
          sed -i "s/database_id = \"00000000-0000-0000-0000-000000000000\"/database_id = \"$DB_ID\"/" wrangler.toml
          grep -q "database_id = \"$DB_ID\"" wrangler.toml
          echo "Dedicated D1 database is ready."
      - name: Install isolated Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fly-snakes-and-ladders-db --remote
      - name: Configure Worker session secret
        run: printf '%s' "$SNAKES_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
      - name: Deploy dedicated Worker
        run: npx wrangler deploy
      - name: Verify Worker health
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://fly-snakes-and-ladders-api.flyinfinityplatform.workers.dev/api/health", { cache: "no-store" });
          const data = await response.json();
          if (!response.ok || data.ok !== true || data.service !== "Fly Infinity Snakes & Ladders API" || data.onlineRooms !== "enabled") {
            console.error("Snakes & Ladders Worker health check failed:", data);
            process.exit(1);
          }
          console.log("Dedicated online game Worker is healthy:", JSON.stringify(data));
          NODE
