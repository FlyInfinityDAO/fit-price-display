<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07100e">
<title>Owner Profile — Mobile Viewport Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden;background:#07100e;color:#eef7f2;font-family:Segoe UI,Tahoma,sans-serif}
main{width:100%;max-width:1320px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 8px;color:#d4af37;font-size:clamp(22px,3vw,32px)}
p{margin:0 0 18px;color:#a9beb4;font-size:13px;line-height:1.6}
.frames{display:grid;grid-template-columns:410px 340px;align-items:start;gap:18px;max-width:100%;overflow-x:auto;padding:2px 2px 14px;overscroll-behavior:contain}
.frame-card{min-width:0;padding:12px;border:1px solid rgba(0,200,150,.28);border-radius:18px;background:rgba(255,255,255,.04)}
.frame-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;color:#d9c36e;font-weight:800;font-size:13px}
.frame-title span:last-child{color:#89cbb1;font-size:11px;font-weight:600}
iframe{display:block;border:1px solid rgba(0,200,150,.35);border-radius:12px;background:#0b1110;max-width:100%}
.mobile-390 iframe{width:390px;height:844px}
.mobile-320 iframe{width:320px;height:740px}
@media(max-width:820px){main{padding:14px 10px 40px}.frames{grid-template-columns:410px 340px}}
</style>
</head>
<body>
<main>
<h1>Owner Profile — Mobile Viewport Lab</h1>
<p>Real embedded CSS viewports at 390×844 and 320×740. Each frame loads the read-only test bench independently; expand branches inside the frame to verify its internal tree scrolling.</p>
<div class="frames">
<section class="frame-card mobile-390">
<div class="frame-title"><span>Mobile · 390 × 844</span><span>390 CSS px</span></div>
<iframe title="Owner Profile 390px mobile viewport" src="owner-profile-test.html?device=390"></iframe>
</section>
<section class="frame-card mobile-320">
<div class="frame-title"><span>Small mobile · 320 × 740</span><span>320 CSS px</span></div>
<iframe title="Owner Profile 320px small mobile viewport" src="owner-profile-test.html?device=320"></iframe>
</section>
</div>
</main>
</body>
</html>
