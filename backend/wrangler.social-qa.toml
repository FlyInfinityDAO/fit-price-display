# Dedicated Fly Infinity Social QA Worker. Never bind this to the production D1 database.
name = "fly-social-qa"
main = "social-api/src/index.js"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "fly-social-qa-db"
database_id = "REPLACE_WITH_SOCIAL_QA_D1_ID"
migrations_dir = "social-api/migrations"

[vars]
APP_ORIGIN = "https://qa-preview.fly-social-qa-preview.pages.dev"
BSC_RPC_URL = "https://bsc-dataseed.binance.org/"
NETWORK_ADDRESS = "0x7f1cB4fce7cB3b6C612c4A7Dd123D3865640dC1B"
CHAIN_ID = "56"
SESSION_TTL_SECONDS = "604800"
MAX_IMAGE_BYTES = "15728640"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = false
persist = false

[observability.issues]
enabled = false
