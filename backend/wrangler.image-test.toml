# Isolated image test Worker. Never deploy this config as fly-ai-api.
name = "fly-ai-image-test"
main = "src/index.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "fly-ai-image-test-db"
# Replace only with the ID of a newly created test database. Do not use fly-ai-db.
database_id = "REPLACE_WITH_FLY_AI_IMAGE_TEST_D1_ID"

[vars]
CHAIN_ID = "56"
FIT_TOKEN_ADDRESS = "0xBebe4ea7aA4037CeF5D0bc25a10f9dcA16120Dfa"
NETWORK_ADDRESS = "0x7f1cB4fce7cB3b6C612c4A7Dd123D3865640dC1B"
MIN_TIER2_FIT = "1"
MIN_TIER3_FIT = "10"
APP_ORIGIN = "https://flyinfinitydao.github.io"
IMAGE_TEST_ENABLED = "true"
IMAGE_GENERATION_ENABLED = "false"

[ai]
binding = "AI"
